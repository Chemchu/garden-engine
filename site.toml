[site]
name = "Gus' digital garden"
source_url = "https://github.com/Chemchu/guslee"

[site.description]
en = "My personal digital garden, built with Rust + HTMX"
es = "Mi jardín digital personal, hecho con Rust + HTMX"

[[site.links]]
label = "GITHUB"
url = "https://www.github.com/Chemchu"

[[site.links]]
label = "LINKEDIN"
url = "https://www.linkedin.com/in/gustavo-lee"

[theme.colors]
background = "#1e242c"
bright = "#dbdfe5"
primary = "#f58a07"
secondary = "#3f826d"
accent = "#bc6c25"
shade = "#323c49"

[theme.fonts.body]
family = "Iosevka"
fallback = "sans-serif"

[[theme.fonts.body.faces]]
src = "fonts/iosevka/Iosevka-Regular-subset.woff2"
weight = 600

[theme.fonts.heading]
family = "Tusker Grotesk"
fallback = "sans-serif"

[[theme.fonts.heading.faces]]
src = "fonts/tusker-grotesk/TuskerGrotesk-subset.woff2"
weight = 600

[features]
news = true
chess = true
music = true
games = true
schedule = true
